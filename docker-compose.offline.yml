# Offline / air-gapped deploy: uses pre-loaded images only (no build).
# Prerequisites:
#   docker load -i proxmox-guestos-customization-offline.tar
#   # or: gunzip -c ...tar.gz | docker load
#   .env present in this directory
#
# Start:
#   docker-compose -f docker-compose.offline.yml up -d

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    image: proxmox-guestos-customization-web:latest
    command: sh -c "python init_db.py && gunicorn --bind 0.0.0.0:5001 wsgi:app"
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5001:5001"
    depends_on:
      - redis
    volumes:
      - app-instance:/app/instance
    restart: unless-stopped

  worker:
    image: proxmox-guestos-customization-worker:latest
    command: celery -A app.celery worker --loglevel=info
    env_file: .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - app-instance:/app/instance
    restart: unless-stopped

volumes:
  redis-data:
  app-instance:
