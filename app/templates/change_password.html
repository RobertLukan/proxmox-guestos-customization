{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1>Change Password</h1>
<p class="page-lead">Choose a strong password (at least 8 characters).</p>
<form method="POST" action="{{ url_for('change_password') }}" id="change-password-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="current_password" class="form-label">Current Password</label>
        <input type="password" class="form-control" id="current_password" name="current_password" required autocomplete="current-password">
    </div>
    <div class="mb-3">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="new_password" name="new_password" required minlength="8" autocomplete="new-password" data-validate="password">
        <div class="form-text">At least 8 characters.</div>
        <div class="invalid-feedback"></div>
    </div>
    <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password" data-validate="password_confirm" data-confirm-of="new_password">
        <div class="invalid-feedback"></div>
    </div>
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Change Password</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Back to Home</a>
    </div>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/validate.js') }}"></script>
<script>
document.getElementById('change-password-form').addEventListener('submit', function(e) {
    if (!window.GuestOSValidate.validateForm(this)) {
        e.preventDefault();
    }
});
window.GuestOSValidate.bindLive(document.getElementById('change-password-form'));
</script>
{% endblock %}
