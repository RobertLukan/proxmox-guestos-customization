<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Confirmed</title>
    <link href="{{ url_for('static', filename='css/bootstrap-5.3.0.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm">
            <h1 class="text-center mb-4">Selection Confirmed</h1>
            <div class="alert alert-success" role="alert">
                You have selected template with VMID: <strong>{{ template_vmid }}</strong>
            </div>
            <div class="d-grid">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Template Selection</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap-5.3.0.bundle.min.js') }}"></script>
</body>
</html>
