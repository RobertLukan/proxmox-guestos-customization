<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <title>Sysprep Workflow</title>
    <link href="{{ url_for('static', filename='css/bootstrap-5.3.0.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm">
            <h1 class="text-center mb-4">New VM with Sysprep</h1>
            <form id="sysprep-form">
                <input type="hidden" name="template_vmid" value="{{ template_vmid }}">

                <h5 class="mt-4">Basic VM Configuration</h5>
                <hr>
                <div class="mb-3">
                    <label for="hostname" class="form-label">New Hostname:</label>
                    <input type="text" name="hostname" id="hostname" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="cores" class="form-label">CPU Cores:</label>
                    <input type="number" name="cores" id="cores" class="form-control" value="2" required>
                </div>
                <div class="mb-3">
                    <label for="ram" class="form-label">RAM (MB):</label>
                    <input type="number" name="ram" id="ram" class="form-control" value="4096" required>
                </div>

                <h5 class="mt-4">Windows Customization</h5>
                <hr>
                <div class="mb-3">
                    <label for="administrator_password" class="form-label">Administrator Password:</label>
                    <input type="password" name="administrator_password" id="administrator_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="timezone" class="form-label">Time Zone:</label>
                    <input type="text" name="timezone" id="timezone" class="form-control" value="Central European Standard Time" required>
                </div>

                <h5 class="mt-4">Network Configuration</h5>
                <hr>
                <div class="mb-3">
                    <label for="bridge" class="form-label">Bridge:</label>
                    <select name="bridge" id="bridge" class="form-select" required>
                        {% for bridge in bridges %}
                        <option value="{{ bridge.iface }}">{{ bridge.iface }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="vlan" class="form-label">VLAN (Optional):</label>
                    <input type="number" name="vlan" id="vlan" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="domain_profile" class="form-label">Domain Profile (optional):</label>
                    <select class="form-select" id="domain_profile" name="domain_profile">
                        <option value="">Select a profile</option>
                        {% for profile, details in domain_profiles.items() %}
                        <option value="{{ profile }}">{{ profile }}</option>
                        {% endfor %}
                    </select>
                    <div class="form-text">Fills DNS and VLAN from the profile. Domain-join credentials stay on the server.</div>
                </div>
                <div class="mb-3">
                    <label for="network_mode" class="form-label">Network Mode:</label>
                    <select class="form-select" id="network_mode" name="network_mode">
                        <option value="static" selected>Static</option>
                        <option value="dhcp">DHCP</option>
                    </select>
                </div>
                <div id="static_fields">
                    <div class="mb-3">
                        <label for="ip_address" class="form-label">IP Address:</label>
                        <input type="text" name="ip_address" id="ip_address" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="netmask_cidr" class="form-label">Netmask (CIDR):</label>
                        <select class="form-select" id="netmask_cidr" name="netmask_cidr" required>
                            <option value="24">24 (255.255.255.0)</option>
                            <option value="25">25 (255.255.255.128)</option>
                            <option value="26">26 (255.255.255.192)</option>
                            <option value="27">27 (255.255.255.224)</option>
                            <option value="28">28 (255.255.255.240)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="gateway" class="form-label">Default Gateway:</label>
                        <input type="text" name="gateway" id="gateway" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="dns_servers" class="form-label">DNS Servers (comma-separated):</label>
                    <input type="text" name="dns_servers" id="dns_servers" class="form-control"
                           placeholder="Optional under DHCP; recommended (domain controller) when joining a domain">
                </div>


                <h5 class="mt-4">Domain Join (Optional)</h5>
                <hr>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="join_domain_checkbox">
                    <label class="form-check-label" for="join_domain_checkbox">Join Domain</label>
                </div>
                <div id="domain_fields" style="display: none;">
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="use_domain_profile_credentials" checked>
                        <label class="form-check-label" for="use_domain_profile_credentials">Use Domain Profile Credentials</label>
                    </div>
                    <div id="domain_credentials_fields" style="display: none;">
                        <div class="mb-3">
                            <label for="domain_name" class="form-label">Domain Name:</label>
                            <input type="text" class="form-control" id="domain_name" name="domain_name" placeholder="corp.example.com">
                        </div>
                        <div class="mb-3">
                            <label for="domain_username" class="form-label">Service Account Username:</label>
                            <input type="text" class="form-control" id="domain_username" name="domain_username">
                        </div>
                        <div class="mb-3">
                            <label for="domain_password" class="form-label">Service Account Password:</label>
                            <input type="password" class="form-control" id="domain_password" name="domain_password">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="domain_ou" class="form-label">Target OU (optional):</label>
                        <input type="text" class="form-control" id="domain_ou" name="domain_ou" placeholder="OU=Servers,DC=corp,DC=example,DC=com">
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">Start Sysprep Workflow</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script>
        $(document).ready(function() {
            const domainProfiles = {{ domain_profiles | tojson }};

            function applyNetworkMode() {
                const isDhcp = $('#network_mode').val() === 'dhcp';
                $('#static_fields').toggle(!isDhcp);
                $('#ip_address, #netmask_cidr, #gateway').prop('required', !isDhcp);
            }
            $('#network_mode').on('change', applyNetworkMode);
            applyNetworkMode();

            function applySelectedProfile() {
                const selected = $('#domain_profile').val();
                if (selected && domainProfiles[selected]) {
                    const p = domainProfiles[selected];
                    if (p.dns_servers !== undefined) {
                        $('#dns_servers').val(p.dns_servers || '');
                    }
                    if (p.vlan !== undefined && p.vlan !== null && p.vlan !== '') {
                        $('#vlan').val(p.vlan);
                    }
                } else {
                    $('#dns_servers').val('');
                    $('#vlan').val('');
                }
            }
            $('#domain_profile').on('change', applySelectedProfile);

            function applyProfileCredentialsMode() {
                const useProfile = $('#use_domain_profile_credentials').is(':checked');
                $('#domain_credentials_fields').toggle(!useProfile);
                $('#domain_name, #domain_username, #domain_password').prop('required', !useProfile);
                // Profile is required for credentials only when joining with profile creds.
                $('#domain_profile').prop('required', useProfile && $('#join_domain_checkbox').is(':checked'));
            }

            $('#use_domain_profile_credentials').on('change', applyProfileCredentialsMode);

            $('#join_domain_checkbox').on('change', function() {
                if ($(this).is(':checked')) {
                    $('#domain_fields').show();
                    applyProfileCredentialsMode();
                } else {
                    $('#domain_fields').hide();
                    $('#domain_name, #domain_username, #domain_password').prop('required', false);
                    $('#domain_profile').prop('required', false);
                }
            });

            $('#sysprep-form').on('submit', async function(event) {
                event.preventDefault();

                const formData = new FormData(this);
                const data = Object.fromEntries(formData.entries());
                const joinDomain = $('#join_domain_checkbox').is(':checked');
                const useProfileCreds = $('#use_domain_profile_credentials').is(':checked');
                data.join_domain = joinDomain;
                data.use_domain_profile_credentials = useProfileCreds;
                if (!joinDomain || useProfileCreds) {
                    data.domain_name = '';
                    data.domain_username = '';
                    data.domain_password = '';
                }

                try {
                    const response = await fetch('{{ url_for('start_sysprep_workflow') }}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        window.location.href = `{{ url_for('workflow', task_id='') }}${result.task_id}`;
                    } else {
                        const err = await response.json().catch(() => ({}));
                        alert(err.error || 'Error starting Sysprep workflow.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while starting the Sysprep workflow.');
                }
            });
        });
    </script>
</body>
</html>
