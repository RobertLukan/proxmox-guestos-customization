<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
    <title>Sysprep Existing VM</title>
    <link href="{{ url_for('static', filename='css/bootstrap-5.3.0.min.css') }}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 30px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm">
            <h1 class="text-center mb-4">Sysprep Existing VM: {{ vm.name }}</h1>
            <form id="sysprep-form">
                <input type="hidden" name="vmid" value="{{ vm.vmid }}">

                <h5 class="mt-4">Windows Customization</h5>
                <hr>
                <div class="mb-3">
                    <label for="hostname" class="form-label">New Hostname:</label>
                    <input type="text" name="hostname" id="hostname" class="form-control" value="{{ vm.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="administrator_password" class="form-label">Administrator Password:</label>
                    <input type="password" name="administrator_password" id="administrator_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="timezone" class="form-label">Time Zone:</label>
                    <input type="text" name="timezone" id="timezone" class="form-control" value="Central European Standard Time" required>
                </div>

                <h5 class="mt-4">Network Configuration</h5>
                <hr>
                <div class="mb-3">
                    <label for="ip_address" class="form-label">IP Address:</label>
                    <input type="text" name="ip_address" id="ip_address" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="netmask_cidr" class="form-label">Netmask (CIDR):</label>
                    <select class="form-select" id="netmask_cidr" name="netmask_cidr" required>
                        <option value="24">24 (255.255.255.0)</option>
                        <option value="25">25 (255.255.255.128)</option>
                        <option value="26">26 (255.255.255.192)</option>
                        <option value="27">27 (255.255.255.224)</option>
                        <option value="28">28 (255.255.255.240)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="gateway" class="form-label">Default Gateway:</label>
                    <input type="text" name="gateway" id="gateway" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="dns_servers" class="form-label">DNS Servers (comma-separated):</label>
                    <input type="text" name="dns_servers" id="dns_servers" class="form-control" required>
                </div>

                <h5 class="mt-4">Domain Join (Optional)</h5>
                <hr>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="join_domain_checkbox">
                    <label class="form-check-label" for="join_domain_checkbox">Join Domain</label>
                </div>
                <div id="domain_fields" style="display: none;">
                    <div class="mb-3">
                        <label for="domain_name" class="form-label">Domain Name:</label>
                        <input type="text" class="form-control" id="domain_name" name="domain_name">
                    </div>
                    <div class="mb-3">
                        <label for="domain_username" class="form-label">Service Account Username:</label>
                        <input type="text" class="form-control" id="domain_username" name="domain_username">
                    </div>
                    <div class="mb-3">
                        <label for="domain_password" class="form-label">Service Account Password:</label>
                        <input type="password" class="form-control" id="domain_password" name="domain_password">
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">Start Sysprep</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script>
        $(document).ready(function() {
            $('#join_domain_checkbox').on('change', function() {
                if ($(this).is(':checked')) {
                    $('#domain_fields').show();
                    $('#domain_name').prop('required', true);
                    $('#domain_username').prop('required', true);
                    $('#domain_password').prop('required', true);
                } else {
                    $('#domain_fields').hide();
                    $('#domain_name').prop('required', false);
                    $('#domain_username').prop('required', false);
                    $('#domain_password').prop('required', false);
                }
            });

            $('#sysprep-form').on('submit', async function(event) {
                event.preventDefault();

                const formData = new FormData(this);
                const data = Object.fromEntries(formData.entries());
                data.join_domain = $('#join_domain_checkbox').is(':checked');

                try {
                    const response = await fetch('{{ url_for('start_sysprep_existing_vm_task') }}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        window.location.href = `{{ url_for('workflow', task_id='') }}${result.task_id}`;
                    } else {
                        alert('Error starting Sysprep task.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while starting the Sysprep task.');
                }
            });
        });
    </script>
</body>
</html>
