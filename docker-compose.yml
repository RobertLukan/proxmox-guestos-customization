services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server
        fi
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - guestos

  web:
    # Explicit image name so offline `docker load` + `up --no-build` works.
    image: proxmox-guestos-customization-web:latest
    build: .
    # Initialize the database (idempotent) then start the web server.
    command: >
      sh -c " . /app/deploy/compose-redis-env.sh
      && python init_db.py
      && gunicorn --bind 0.0.0.0:5001 --workers 2 --timeout 120 wsgi:app"
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    # Bound to loopback for local admin/debug; public HTTPS is via caddy:443.
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      # Persist the SQLite database (Flask-SQLAlchemy stores it under instance/).
      - app-instance:/app/instance
    restart: unless-stopped
    networks:
      - guestos

  worker:
    image: proxmox-guestos-customization-worker:latest
    build: .
    command: >
      sh -c " . /app/deploy/compose-redis-env.sh
      && celery -A app.celery worker --loglevel=info -Q clone_queue --hostname=clone@%h --concurrency=${CLONE_WORKER_CONCURRENCY:-4} --prefetch-multiplier=${CLONE_PREFETCH_MULTIPLIER:-1}"
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - app-instance:/app/instance
    restart: unless-stopped
    networks:
      - guestos

  verify-worker:
    image: proxmox-guestos-customization-worker:latest
    build: .
    command: >
      sh -c " . /app/deploy/compose-redis-env.sh
      && celery -A app.celery worker --loglevel=info -Q verify_queue --hostname=verify@%h --concurrency=${VERIFY_WORKER_CONCURRENCY:-2} --prefetch-multiplier=${VERIFY_PREFETCH_MULTIPLIER:-1}"
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - app-instance:/app/instance
    restart: unless-stopped
    networks:
      - guestos

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "443:443"
    environment:
      - GUESTOS_TLS_HOST=${GUESTOS_TLS_HOST:-guestos.example.com}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - guestos

volumes:
  redis-data:
  app-instance:
  caddy-data:
  caddy-config:

networks:
  guestos:
    driver: bridge
