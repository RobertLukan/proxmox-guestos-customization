openapi: 3.0.3
info:
  title: GuestOS machine API
  version: 2.3.0
  description: |
    Sysprep customize sidecar for Proxmox (template → clone → Sysprep → verify).
    Authenticate with `Authorization: Bearer <token>` or `X-Api-Token`.
servers:
  - url: https://guestos.example.com
paths:
  /api/health:
    get:
      summary: Liveness and shallow dependency checks
      responses:
        '200':
          description: Healthy
        '503':
          description: Degraded (database or Redis)
  /api/version:
    get:
      summary: App version and PDM compatibility hint
      responses:
        '200':
          description: Version payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: '2.3.0'
                  min_pdm_guestos:
                    type: string
                    example: '2.3.0'
  /api/tasks:
    get:
      summary: List customization tasks
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            default: customization
        - in: query
          name: remote_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: running
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: cursor
          schema:
            type: string
          description: Optional keyset cursor (task id from previous page).
        - in: query
          name: batch_id
          schema:
            type: string
          description: Filter tasks by a batch id.
      responses:
        '200':
          description: Paginated task list
  /api/batches:
    get:
      summary: List bulk provisioning batches
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: remote_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated batch list
  /api/batches/{batch_id}:
    get:
      summary: Get one batch and its tasks
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: path
          name: batch_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch payload
        '404':
          description: Not found
  /api/batches/{batch_id}/cancel:
    post:
      summary: Cancel pending/running items in a batch (best effort)
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: path
          name: batch_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancel summary
        '404':
          description: Not found
  /api/metrics:
    get:
      summary: Runtime counters for tasks and batches
      security:
        - bearerAuth: []
        - apiToken: []
      responses:
        '200':
          description: Metrics payload
  /api/provision_limits:
    get:
      summary: Resource ceilings, remaining daily/batch quota, and storage status
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: query
          name: template_vmid
          schema:
            type: integer
        - in: query
          name: remote_id
          schema:
            type: string
      responses:
        '200':
          description: Limits snapshot (family caps, quotas, storage warn/block)
        '401':
          description: Unauthorized
  /start_sysprep_workflow:
    post:
      summary: Start clone + Sysprep workflow
      security:
        - bearerAuth: []
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysprepStart'
      responses:
        '200':
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
        '400':
          description: Validation error
        '401':
          description: Unauthorized
  /start_sysprep_bulk_workflow:
    post:
      summary: Start clone + Sysprep workflow for many desktops
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          required: false
          description: Optional client idempotency key for replay-safe retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysprepBulkStart'
      responses:
        '200':
          description: Batch accepted (or idempotent replay)
        '400':
          description: Validation or admission error
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  schemas:
    SysprepStart:
      type: object
      required:
        - template_vmid
        - hostname
        - cores
        - ram
        - administrator_password
      properties:
        template_vmid:
          type: integer
        hostname:
          type: string
        cores:
          type: integer
        ram:
          type: integer
          description: Memory in MiB
        bridge:
          type: string
          description: Defaults to PRIMARY_BRIDGE when omitted
        vlan:
          type: integer
          nullable: true
        network_mode:
          type: string
          enum: [dhcp, static]
          default: static
        ip_address:
          type: string
        netmask_cidr:
          type: integer
        gateway:
          type: string
        dns_servers:
          type: string
          description: Comma-separated IPv4/IPv6 DNS list
        timezone:
          type: string
          description: Windows Time Zone ID (curated list in UI)
        locale:
          type: string
          description: Windows culture ID (e.g. en-US, de-DE)
        workgroup:
          type: string
          description: Workgroup when join_domain is false (default WORKGROUP)
        enable_ipv6:
          type: boolean
          default: false
          description: Opt-in IPv6 on the primary NIC (or nics[].enable_ipv6)
        ipv6_address:
          type: string
        ipv6_prefix:
          type: integer
        ipv6_gateway:
          type: string
        spec_id:
          type: integer
          description: Apply a saved Customization Spec (non-secret fields); admin password still required
        spec_name:
          type: string
        nics:
          type: array
          description: Optional multi-NIC layout (single customize only; not for bulk)
          items:
            type: object
        administrator_password:
          type: string
        join_domain:
          type: boolean
          default: false
        domain_name:
          type: string
        domain_username:
          type: string
        domain_password:
          type: string
        domain_ou:
          type: string
        remote_id:
          type: string
          description: Key into PVE_REMOTES_JSON (credentials resolved in worker)
        manage_disks:
          type: boolean
          default: false
          description: Server 2019 templates only; fails validation otherwise
        disks:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [os, data, pagefile]
              size_gb:
                type: integer
              grow_to_gb:
                type: integer
              drive_letter:
                type: string
              label:
                type: string
              ensure_pagefile:
                type: boolean
              reformat:
                type: boolean
        fast_waits:
          type: boolean
          description: Lab-only shorter boot/agent waits
    SysprepBulkStart:
      type: object
      required:
        - shared
        - items
      properties:
        request_id:
          type: string
          description: Optional idempotency key (or provide Idempotency-Key header).
        shared:
          $ref: '#/components/schemas/SysprepStart'
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            properties:
              hostname:
                type: string
              ip_address:
                type: string
              vlan:
                type: integer
              domain_profile:
                type: string
