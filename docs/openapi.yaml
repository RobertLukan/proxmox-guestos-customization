openapi: 3.0.3
info:
  title: GuestOS machine API
  version: 2.3.0
  description: |
    Sysprep customize sidecar for Proxmox (template → clone → Sysprep → verify).
    Authenticate with `Authorization: Bearer <token>` or `X-Api-Token`.
servers:
  - url: https://guestos.example.com
paths:
  /api/health:
    get:
      summary: Liveness and shallow dependency checks
      responses:
        '200':
          description: Healthy
        '503':
          description: Degraded (database or Redis)
  /api/version:
    get:
      summary: App version and PDM compatibility hint
      responses:
        '200':
          description: Version payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: '2.3.0'
                  min_pdm_guestos:
                    type: string
                    example: '2.3.0'
  /api/tasks:
    get:
      summary: List customization tasks
      security:
        - bearerAuth: []
        - apiToken: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            default: customization
        - in: query
          name: remote_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: running
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            maximum: 500
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated task list
  /start_sysprep_workflow:
    post:
      summary: Start clone + Sysprep workflow
      security:
        - bearerAuth: []
        - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SysprepStart'
      responses:
        '200':
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
        '400':
          description: Validation error
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  schemas:
    SysprepStart:
      type: object
      required:
        - template_vmid
        - hostname
        - cores
        - ram
        - administrator_password
      properties:
        template_vmid:
          type: integer
        hostname:
          type: string
        cores:
          type: integer
        ram:
          type: integer
          description: Memory in MiB
        bridge:
          type: string
          description: Defaults to PRIMARY_BRIDGE when omitted
        vlan:
          type: integer
          nullable: true
        network_mode:
          type: string
          enum: [dhcp, static]
          default: static
        ip_address:
          type: string
        netmask_cidr:
          type: integer
        gateway:
          type: string
        dns_servers:
          type: string
          description: Comma-separated IPv4 list
        timezone:
          type: string
        administrator_password:
          type: string
        join_domain:
          type: boolean
          default: false
        domain_name:
          type: string
        domain_username:
          type: string
        domain_password:
          type: string
        domain_ou:
          type: string
        remote_id:
          type: string
          description: Key into PVE_REMOTES_JSON (credentials resolved in worker)
        manage_disks:
          type: boolean
          default: false
          description: Server 2019 templates only; fails validation otherwise
        disks:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [os, data, pagefile]
              size_gb:
                type: integer
              grow_to_gb:
                type: integer
              drive_letter:
                type: string
              label:
                type: string
              ensure_pagefile:
                type: boolean
              reformat:
                type: boolean
        fast_waits:
          type: boolean
          description: Lab-only shorter boot/agent waits
