name: Tests

on:
  push:
  pull_request:

jobs:
  test-web:
    name: Standalone web / CSRF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run web + core tests
        run: pytest -m "not api" --cov=app --cov-report=term --cov-fail-under=55 --cov-config=tests/coveragerc.not_api

  test-api:
    name: Machine API / PDM surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API tests
        # Subset coverage of the machine API surface; unit-tested modules are
        # omitted via tests/coveragerc.api (see that file). Full-app gate is the
        # "not api" job (--cov-fail-under=55).
        run: pytest -m api --cov=app --cov-report=term --cov-fail-under=40 --cov-config=tests/coveragerc.api
