name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  python-sast-and-deps:
    name: Bandit + pip-audit + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install app + audit tools
        run: |
          pip install -r requirements.txt
          pip install 'pip-audit==2.9.0' 'bandit[toml]==1.8.3'

      - name: Bandit (Python SAST)
        run: |
          bandit -r app -c .bandit -ll -ii -f json -o bandit-report.json
          bandit -r app -c .bandit -ll -ii

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: gitleaks (secrets)
        run: |
          VER=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact --no-banner

  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (fs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif
          cache-dir: ${{ github.workspace }}/.cache/trivy

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: guestos-security:ci
          # Buildx SBOM/provenance lists python:3.12-slim's bundled
          # setuptools 70.3 / msgpack 1.1 even after we replace them.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export rootfs for Trivy
        run: |
          # trivy image still consumes Buildx/Docker Hub CycloneDX SBOMs that
          # list python:3.12-slim's old setuptools 70.3 / msgpack 1.1 even after
          # we replace those packages. Scan the exported filesystem instead.
          rootfs="${{ github.workspace }}/image-rootfs"
          mkdir -p "$rootfs"
          cid=$(docker create guestos-security:ci)
          docker export "$cid" | tar -x -C "$rootfs"
          docker rm "$cid"
          docker rmi guestos-security:ci
          find "$rootfs" \( \
            -name '*.cdx' -o -name '*.cdx.json' \
            -o -name '*.spdx' -o -name '*.spdx.json' \
            -o -name 'bom.json' -o -name 'sbom.json' \
          \) -delete 2>/dev/null || true

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Skip in-tree SBOM files; scan installed OS/Python packages only.
          TRIVY_DISABLED_ANALYZERS: sbom
        with:
          scan-type: rootfs
          scan-ref: ${{ github.workspace }}/image-rootfs
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          # Image base OS CVEs change often; publish SARIF, don't hard-fail CI.
          exit-code: '0'
          format: sarif
          output: trivy-image.sarif
          cache-dir: ${{ github.workspace }}/.cache/trivy

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
