name: Release artifacts

# Create a GitHub Release when a version tag is pushed (e.g. v2.5.0).
# Attaches SHA256 checksums for the source archive and an SBOM of runtime deps.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Checksums + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Build source archive checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="proxmox-guestos-customization-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="proxmox-guestos-customization-${TAG}/" -o "${ARCHIVE}" "${TAG}"
          sha256sum "${ARCHIVE}" | tee SHA256SUMS
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Generate CycloneDX SBOM (declared runtime requirements)
        run: |
          pip install 'cyclonedx-bom==5.1.1'
          cyclonedx-py requirements requirements.txt -o sbom.cdx.json --of JSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            SHA256SUMS
            sbom.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
