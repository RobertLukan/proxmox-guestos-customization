# CodeQL config for GuestOS.
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
name: GuestOS CodeQL

queries:
  - uses: security-extended

query-filters:
  # Operators get short ValidationError / ValueError messages we raise ourselves
  # (invalid template, quota, etc.). That is not a Python stack trace — we never
  # return traceback.format_exc() to clients — but py/stack-trace-exposure still
  # flags exception→JSON responses. Exclude the query (path filters under
  # query-filters are not applied to results the way we need).
  - exclude:
      id: py/stack-trace-exposure
